<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Work Log</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Daily Work Log</h1>
          <span class="sub-label">Teams Task Tracker</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btnOpenDashboard" class="icon-btn" title="Work Entries Dashboard (Table & Filters)" aria-label="Open Work Entries Dashboard">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </button>
        <button id="btnOpenOptions" class="icon-btn" title="Settings & Manage Lists" aria-label="Open Options">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Daily Progress Tracker Card -->
    <section class="progress-card">
      <div class="progress-info">
        <span id="progressSummary" class="progress-label">Today: 0 tasks logged</span>
        <span id="progressPercent" class="progress-percent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressBarFill" class="progress-bar-fill" style="width: 0%"></div>
      </div>
    </section>

    <!-- Date Navigation Bar -->
    <nav class="date-navigator">
      <button id="btnPrevDay" class="nav-arrow-btn" title="Previous Day" aria-label="Previous Day">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="date-center">
        <input type="date" id="dateInputHidden" class="date-picker-input" tabindex="-1">
        <button id="btnDateDisplay" class="date-display-btn" title="Click to pick date">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span id="dateLabel">Today</span>
        </button>
      </div>

      <button id="btnNextDay" class="nav-arrow-btn" title="Next Day" aria-label="Next Day">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <button id="btnTodayShortcut" class="today-shortcut-btn" title="Jump to Today">Today</button>
    </nav>

    <!-- Add Task Form -->
    <form id="addEntryForm" class="add-form" novalidate>
      <div class="form-row form-grid-2">
        <div class="form-group">
          <label for="selectPlatform">Platform</label>
          <div class="select-wrapper">
            <select id="selectPlatform" required>
              <!-- Populated dynamically -->
            </select>
            <span class="select-arrow">▾</span>
          </div>
        </div>
        <div class="form-group">
          <label for="selectProject">Project</label>
          <div class="select-wrapper">
            <select id="selectProject" required>
              <!-- Populated dynamically -->
            </select>
            <span class="select-arrow">▾</span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="inputTask">Task Description</label>
        <div class="input-with-action">
          <input 
            type="text" 
            id="inputTask" 
            placeholder="What did you work on? (e.g. Fixed login bug)" 
            autocomplete="off" 
            required
          >
        </div>
      </div>

      <div class="form-row status-and-submit">
        <div class="status-selector-container">
          <span class="field-label">Status</span>
          <div class="status-toggle-group" id="statusToggleGroup" role="radiogroup" aria-label="Task Status">
            <button type="button" class="status-pill active" data-status="todo" role="radio" aria-checked="true">
              <span class="status-dot dot-todo"></span> To Do
            </button>
            <button type="button" class="status-pill" data-status="in_progress" role="radio" aria-checked="false">
              <span class="status-dot dot-progress"></span> In Progress
            </button>
            <button type="button" class="status-pill" data-status="completed" role="radio" aria-checked="false">
              <span class="status-dot dot-completed"></span> Done
            </button>
          </div>
        </div>

        <button type="submit" id="btnAddEntry" class="btn-primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Add</span>
        </button>
      </div>
    </form>

    <!-- Entries Section -->
    <section class="entries-section">
      <div class="entries-header">
        <div class="entries-count-badge">
          <span id="entriesCountText">0 entries logged</span>
        </div>
        <div class="entries-header-actions">
          <button id="btnFillPlanner" class="btn-planner-sync" title="Auto-fill these items into the open Microsoft Planner task checklist">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <polyline points="9 11 12 14 22 4"></polyline>
              <line x1="8" y1="12" x2="8" y2="12.01"></line>
              <line x1="8" y1="16" x2="8" y2="16.01"></line>
              <line x1="12" y1="16" x2="16" y2="16"></line>
            </svg>
            <span>Fill Planner</span>
          </button>
          <button id="btnCopyDay" class="btn-copy-day" title="Copy day summary formatted for Teams/Slack">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="copyDayText">Copy Day</span>
          </button>
        </div>
      </div>

      <!-- Entries List Container -->
      <div id="entriesList" class="entries-list">
        <!-- Rendered dynamically -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">📝</div>
        <p class="empty-title">No tasks logged for this day</p>
        <p class="empty-subtitle">Use the form above to log your first work item.</p>
      </div>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <button id="btnManageConfig" class="link-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        Manage Projects & Platforms
      </button>
    </footer>

    <!-- Floating Toast Notification -->
    <div id="toastNotification" class="toast hidden">
      <span id="toastIcon" class="toast-icon">✓</span>
      <span id="toastMessage">Copied to clipboard!</span>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
